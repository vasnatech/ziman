# Publishes websites/ziman.dev/ to GitHub Pages.
#
# This workflow exists for one reason: Pages serves the repository root or docs/, and the site lives
# in a nested directory, so the only way to publish it is to upload that directory as the Pages
# artifact. Everything else here is the standard Pages deployment.
name: Deploy ziman.dev

on:
  push:
    branches: [main]
    paths:
      - websites/ziman.dev/**
      - tools/check_site.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one halfway: a cancelled deploy leaves the live site on
# the previous version with nothing saying why.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # The same check the Cloudflare workflow runs, and the same one you can run locally.
      - name: Check the site is fit to publish
        run: python3 tools/check_site.py websites/ziman.dev

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The whole point: the artifact is the site directory, not the repository.
      - name: Upload the site directory
        uses: actions/upload-pages-artifact@v3
        with:
          path: websites/ziman.dev

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
